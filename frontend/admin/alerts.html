<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alerts | UEBA SHIELD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/cyber.css">
    <style>
        /* ── Color-coded alert row glow strips ─────────── */
        .alert-row-critical { border-left: 3px solid #ef4444 !important; }
        .alert-row-high      { border-left: 3px solid #f97316 !important; }
        .alert-row-elevated  { border-left: 3px solid #3b82f6 !important; }

        .alert-row-critical td:first-child { background: rgba(239,68,68,0.04); }
        .alert-row-high td:first-child      { background: rgba(249,115,22,0.04); }
        .alert-row-elevated td:first-child  { background: rgba(59,130,246,0.04); }

        /* Severity badge colours */
        .sev-critical { background: rgba(239,68,68,0.15);  color:#fca5a5; border:1px solid rgba(239,68,68,0.35);  }
        .sev-high     { background: rgba(249,115,22,0.15); color:#fdba74; border:1px solid rgba(249,115,22,0.35); }
        .sev-elevated { background: rgba(59,130,246,0.15); color:#93c5fd; border:1px solid rgba(59,130,246,0.35); }

        .sev-badge {
            display:inline-block; padding:2px 10px; border-radius:20px;
            font-size:0.68rem; font-weight:700; letter-spacing:0.06em;
        }

        /* Threat-type chip */
        .threat-chip {
            display:inline-block; padding:2px 10px; border-radius:8px;
            font-size:0.72rem; font-weight:600;
            background: rgba(148,163,184,0.1);
            border: 1px solid rgba(148,163,184,0.2);
            color: #e2e8f0;
        }

        /* Alert stats bar */
        .alert-stat {
            display:flex; align-items:center; gap:8px;
            padding:10px 18px; border-radius:14px; font-weight:600; font-size:0.8rem;
        }
        .alert-stat-critical { background:rgba(239,68,68,0.1);  border:1px solid rgba(239,68,68,0.25);  color:#fca5a5; }
        .alert-stat-high     { background:rgba(249,115,22,0.1); border:1px solid rgba(249,115,22,0.25); color:#fdba74; }
        .alert-stat-elevated { background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.25); color:#93c5fd; }
    </style>
</head>
<body class="bg-deep">

    <aside class="sidebar">
        <div class="logo-container">
            <h4 class="fw-bold m-0 text-primary"><i class="fas fa-circle-nodes me-2"></i>UEBA<span class="text-white">SHIELD</span></h4>
        </div>
        <nav>
            <a href="dashboard.html" class="nav-link"><i class="fas fa-chart-line"></i> Analytics</a>
            <a href="alerts.html" class="nav-link active" style="background:rgba(239,68,68,0.1); color:#fca5a5 !important; border-left:3px solid #ef4444;">
                <i class="fas fa-bell text-danger"></i> Security Alerts
            </a>
            <a href="risk.html" class="nav-link"><i class="fas fa-user-shield"></i> User Risk</a>
            <div class="mt-5 pt-5">
                <a href="index.html" class="nav-link text-danger"><i class="fas fa-power-off"></i> Logout</a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold m-0 text-white"><i class="fas fa-bell text-danger me-3"></i>Security Alerts</h1>
                <p class="text-muted small mt-1">Real-time behavioral anomalies across enterprise endpoints</p>
            </div>
            <button class="btn rounded-pill px-4 py-2 fw-bold" 
                style="background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.35); color:#fca5a5;"
                onclick="loadAllAlerts()">
                <i class="fas fa-sync-alt me-2"></i>Refresh Feed
            </button>
        </header>

        <!-- Alert Summary Stats -->
        <div class="d-flex gap-3 mb-4 flex-wrap">
            <div class="alert-stat alert-stat-critical">
                <i class="fas fa-radiation"></i>
                <span id="countCritical">0</span> CRITICAL
            </div>
            <div class="alert-stat alert-stat-high">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="countHigh">0</span> HIGH
            </div>
            <div class="alert-stat alert-stat-elevated">
                <i class="fas fa-info-circle"></i>
                <span id="countElevated">0</span> ELEVATED
            </div>
        </div>

        <div class="cyber-card p-0" style="overflow:hidden;">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead style="background:rgba(15,23,42,0.8);">
                        <tr>
                            <th style="padding:14px 20px;">IDENTIFIED SUBJECT</th>
                            <th>TIMESTAMP</th>
                            <th>THREAT TYPE</th>
                            <th>CRITICALITY</th>
                            <th>OBSERVATION DETAILS</th>
                        </tr>
                    </thead>
                    <tbody id="alertsBody">
                        <tr><td colspan="5" class="text-center py-5" style="color:#64748b;">
                            <i class="fas fa-satellite-dish fa-2x mb-3 d-block"></i>Loading threat intelligence...
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadAllAlerts();
            updateAlertCounts();
            // Connect SSE so alerts auto-refresh when new anomaly is generated
            connectAdminSSE();
        });

        // Override SSE handler on this page to also reload alerts
        window.connectAdminSSE = function () {
            if (typeof adminSSE !== 'undefined' && adminSSE) adminSSE.close();
            adminSSE = new EventSource(`${API_BASE_URL}/events/stream`);
            adminSSE.onmessage = async (evt) => {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.event === 'new_anomaly') {
                        await loadAllAlerts();
                        updateAlertCounts();
                    }
                } catch(e) {}
            };
            adminSSE.onerror = () => setTimeout(window.connectAdminSSE, 5000);
        };

        function updateAlertCounts() {
            setTimeout(() => {
                const rows = document.querySelectorAll('#alertsBody td .sev-badge');
                let c = 0, h = 0, e = 0;
                rows.forEach(el => {
                    const t = el.textContent.trim();
                    if (t === 'CRITICAL') c++;
                    else if (t === 'HIGH') h++;
                    else e++;
                });
                document.getElementById('countCritical').textContent = c;
                document.getElementById('countHigh').textContent = h;
                document.getElementById('countElevated').textContent = e;
            }, 600);
        }
    </script>
</body>
</html>
